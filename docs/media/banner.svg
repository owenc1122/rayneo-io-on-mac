    <rect x="22" y="6" width="80" height="58" rx="24" fill="url(#lens)" stroke="url(#rim)" stroke-width="7"/>
    <rect x="122" y="6" width="80" height="58" rx="24" fill="url(#lens)" stroke="url(#rim)" stroke-width="7"/>
    <path d="M102 26 Q112 18 122 26" fill="none" stroke="url(#rim)" stroke-width="7"/>
    <rect x="40" y="30" width="44" height="6" rx="3" fill="#22E05A"/>
    <rect x="40" y="42" width="28" height="5" rx="2.5" fill="#22E05A" fill-opacity=".5"/>
    <rect x="140" y="30" width="44" height="6" rx="3" fill="#22E05A"/>
    <rect x="140" y="42" width="28" height="5" rx="2.5" fill="#22E05A" fill-opacity=".5"/>
  </g>
  <text x="54" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#22E05A" fill-opacity=".8">nsh&gt; _</text>
</g>
<g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<text x="470" y="178" font-size="76" font-weight="700" fill="#FFFFFF" letter-spacing="-1.5">rayneo-io<tspan fill="#22E05A">-on-</tspan>mac</text>
<text x="474" y="236" font-size="28" fill="#AEB4BE">Boot your own RayNeo iO firmware on a Mac, in Renode</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600">
