<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15181D"/><stop offset="1" stop-color="#07080A"/></linearGradient>
<radialGradient id="glow" cx="0.2" cy="0.5" r="0.45"><stop offset="0" stop-color="#22E05A" stop-opacity=".16"/><stop offset="1" stop-color="#22E05A" stop-opacity="0"/></radialGradient>
<linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7A818C"/><stop offset="1" stop-color="#2C3036"/></linearGradient>
<linearGradient id="lens" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#10301B"/><stop offset="1" stop-color="#050C07"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".035"/></pattern>
</defs>
<rect width="1280" height="400" rx="24" fill="url(#bg)"/>
<rect width="1280" height="400" rx="24" fill="url(#grid)"/>
<rect width="1280" height="400" rx="24" fill="url(#glow)"/>
<!-- laptop -->
<g transform="translate(70,82)">
