  <rect x="38" y="18" width="264" height="160" rx="6" fill="#050607"/>
  <path d="M0 208 H340 L326 228 H14 Z" fill="#2A2E35"/>
  <rect x="140" y="208" width="60" height="6" rx="3" fill="#15181D"/>
