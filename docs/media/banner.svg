<rect x="656" y="272" width="150" height="38" rx="19" fill="#22E05A" fill-opacity=".10" stroke="#22E05A" stroke-opacity=".45"/><text x="731" y="297" text-anchor="middle" fill="#22E05A">C# models</text>
<rect x="820" y="272" width="170" height="38" rx="19" fill="#2E8BFF" fill-opacity=".12" stroke="#2E8BFF" stroke-opacity=".5"/><text x="905" y="297" text-anchor="middle" fill="#5AA2FF">Swift viewer</text>
<rect x="1004" y="272" width="196" height="38" rx="19" fill="#FFA42E" fill-opacity=".10" stroke="#FFA42E" stroke-opacity=".5"/><text x="1102" y="297" text-anchor="middle" fill="#FFB85C">experimental</text>
